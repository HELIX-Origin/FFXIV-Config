# ==============================================================================
# FFXIV Config - Jekyll & GitHub Pages Site Configuration
# ==============================================================================
# Documentation site for the FFXIV Config HUD/hotbar setup.
# Consumes the shared HELIX Origin theme "helix-docs" as a remote theme.
# ==============================================================================

# Site Identity & Canonical URLs
title: FFXIV Config
tagline: HUD & Hotbar Setup for Final Fantasy XIV
tagline_short: HUD & Hotbar Setup
description: "A custom, information-dense HUD, hotbar and macro layout for Final Fantasy XIV — every combat, crafting and gathering job pre-arranged, with an on-screen macro menu for switching jobs."
url: "https://www.helix-origin.club"
baseurl: "/FFXIV-Config"
repository: "HELIX-Origin/FFXIV-Config"
github_username: "HELIX-Origin"

# Author & Publisher Metadata
author:
  name: "HELIX Origin"
  url: "https://www.helix-origin.club"
  github: "HELIX-Origin"

# Remote Theme Configuration
remote_theme: HELIX-Origin/helix-docs

encoding: "utf-8"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  parse_block_html: true
  syntax_highlighter: rouge

# GitHub Pages Core Plugin Whitelist
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

optional_front_matter:
  remove_originals: true

# Jekyll Collections Registration
# - docs: guides and reference pages (_docs/ -> /docs/:path/)
collections:
  docs:
    output: true
    permalink: /docs/:path/

# Build Inclusions & Exclusions
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - src
  - .github
  - .vscode
  - "*.ps1"
  - "*.bat"
  - "*.tmp"

include:
  - assets

# Frontmatter Cascade Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      comments: false
      nav_order: 9999

  # Portal home page (index.md)
  - scope:
      path: "index.md"
    values:
      layout: default
      page_class: page--home

  # Docs collection default (all documents in _docs/)
  # Type scopes use Jekyll's canonical form (`path: ""` + `type:`) so YAML
  # schema linters that require `path` are satisfied.
  - scope:
      path: ""
      type: docs
    values:
      layout: docs
      page_class: page--doc
      section: docs
